basePath: /
definitions:
  models.MovieEvent:
    properties:
      id:
        type: string
      payload:
        $ref: '#/definitions/models.MovieEventPayload'
      timestamp:
        type: string
      type:
        type: string
    type: object
  models.MovieEventPayload:
    properties:
      action:
        type: string
      description:
        type: string
      genres:
        items:
          type: string
        type: array
      movie_id:
        type: integer
      rating:
        type: number
      title:
        type: string
      user_id:
        type: integer
    type: object
  models.MovieEventResponse:
    properties:
      event:
        $ref: '#/definitions/models.MovieEvent'
      offset:
        type: integer
      partition:
        type: integer
      status:
        type: string
    type: object
  models.PaymentEvent:
    properties:
      id:
        type: string
      payload:
        $ref: '#/definitions/models.PaymentEventPayload'
      timestamp:
        type: string
      type:
        type: string
    type: object
  models.PaymentEventPayload:
    properties:
      amount:
        type: number
      method_type:
        type: string
      payment_id:
        type: integer
      status:
        type: string
      timestamp:
        type: string
      user_id:
        type: integer
    type: object
  models.PaymentEventResponse:
    properties:
      event:
        $ref: '#/definitions/models.PaymentEvent'
      offset:
        type: integer
      partition:
        type: integer
      status:
        type: string
    type: object
  models.UserEvent:
    properties:
      id:
        type: string
      payload:
        $ref: '#/definitions/models.UserEventPayload'
      timestamp:
        type: string
      type:
        type: string
    type: object
  models.UserEventPayload:
    properties:
      action:
        type: string
      email:
        type: string
      timestamp:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  models.UserEventResponse:
    properties:
      event:
        $ref: '#/definitions/models.UserEvent'
      offset:
        type: integer
      partition:
        type: integer
      status:
        type: string
    type: object
  responses.Error:
    properties:
      message:
        type: string
      type:
        type: string
    type: object
  responses.ErrorResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/responses.Error'
        type: array
    type: object
host: localhost:8082
info:
  contact: {}
  description: POST endpoints for movie, user, and payment events (Kafka ingestion).
  title: CinemaAbyss Events Service API
  version: "1.0"
paths:
  /api/events/movie:
    post:
      consumes:
      - application/json
      description: Регистрирует новое событие, связанное с фильмом
      parameters:
      - description: Данные события фильма
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.MovieEventPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.MovieEventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Создание события фильма
      tags:
      - events
  /api/events/payment:
    post:
      consumes:
      - application/json
      description: Регистрирует новое событие, связанное с платежом
      parameters:
      - description: Данные события платежа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PaymentEventPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.PaymentEventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Создание события платежа
      tags:
      - events
  /api/events/user:
    post:
      consumes:
      - application/json
      description: Регистрирует новое событие, связанное с пользователем
      parameters:
      - description: Данные события пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserEventPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.UserEventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Создание события пользователя
      tags:
      - events
swagger: "2.0"
